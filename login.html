<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Sign In | Asset Tracker</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
	<link rel="stylesheet" href="light.css">
	<link rel="stylesheet" href="dark.css">
</head>
<body>
	<main class="page container-fluid">
		<button class="theme-switch" id="theme-toggle" type="button" role="switch" aria-checked="false" aria-label="Dark mode">
			<span class="knob">
				<svg class="sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg>
				<svg class="moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"></path></svg>
			</span>
		</button>

		<section class="login-box card" aria-labelledby="page-title">
            <h5 class="card-title"> CorpGear Hub</h5>
			<h1 class="card-title">Welcome Back</h1>
			<p class="intro card-text">Sign in to manage your company assets.</p>

			<form id="login-form" novalidate>
				<label class="form-label" for="email">Email Address</label>
				<input class="form-control" id="email" name="email" type="email" placeholder="you@example.com">

				<label class="form-label" for="password">Password</label>
				<input class="form-control" id="password" name="password" type="password" placeholder="••••••••">

				<div class="form-options d-flex align-items-center justify-content-between">
					<div class="form-check">
						
					</div>
					
				</div>

				<button class="sign-in-button btn btn-primary w-100" type="submit">Sign in</button>
				<p class="message form-text" id="message" aria-live="polite"></p>
			</form>
		</section>
		<footer>CorpGear Hub</footer>
	</main>

	<script>
		const themeToggle = document.getElementById('theme-toggle');
		const loginForm = document.getElementById('login-form');

		function setTheme(isDark) {
			document.body.classList.toggle('dark-mode', isDark);
			themeToggle.setAttribute('aria-checked', String(isDark));
			try {
				localStorage.setItem('theme', isDark ? 'dark' : 'light');
			} catch (error) {
				// Theme switching still works if browser storage is unavailable.
			}
		}

		let savedTheme = null;
		try {
			savedTheme = localStorage.getItem('theme');
		} catch (error) {
			// Use the system theme if browser storage is unavailable.
		}

		const prefersLight = window.matchMedia('(prefers-color-scheme: light)').matches;
		setTheme(savedTheme ? savedTheme === 'dark' : !prefersLight);

		themeToggle.addEventListener('click', () => {
			setTheme(themeToggle.getAttribute('aria-checked') !== 'true');
		});

		loginForm.addEventListener('submit', (event) => {
			event.preventDefault();
			window.location.href = 'dashboard.html';
		});
	</script>
</body>
</html>
